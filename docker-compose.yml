services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: mak-ai-n8n

    ports:
      - "5678:5678"

    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - N8N_SECURE_COOKIE=false
      - GENERIC_TIMEZONE=Asia/Manila

    volumes:
      - ./n8n_data:/home/node/.n8n

    restart: unless-stopped
